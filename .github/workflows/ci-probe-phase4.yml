name: CI probe phase4

on:
  push:
    branches: [feat/ux-navigation-phase4]

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Sonde 1 - typecheck
        run: |
          set +e
          echo "### Sonde phase4 v1 — typecheck" > /tmp/probe.md
          echo "" >> /tmp/probe.md
          npm run typecheck > /tmp/tsc.log 2>&1
          code=$?
          echo 'typecheck_exit_code='"$code" >> /tmp/probe.md
          echo '```text' >> /tmp/probe.md
          tail -n 120 /tmp/tsc.log >> /tmp/probe.md
          echo '```' >> /tmp/probe.md
          exit 0

      - name: Sonde 2 - lint
        run: |
          set +e
          echo "" >> /tmp/probe.md
          echo "### Sonde phase4 v1 — lint" >> /tmp/probe.md
          echo "" >> /tmp/probe.md
          npm run lint > /tmp/lint.log 2>&1
          code=$?
          echo 'lint_exit_code='"$code" >> /tmp/probe.md
          echo '```text' >> /tmp/probe.md
          tail -n 120 /tmp/lint.log >> /tmp/probe.md
          echo '```' >> /tmp/probe.md
          exit 0

      - name: Sonde 3 - tests
        run: |
          set +e
          echo "" >> /tmp/probe.md
          echo "### Sonde phase4 v1 — npm test" >> /tmp/probe.md
          echo "" >> /tmp/probe.md
          npm test > /tmp/test.log 2>&1
          code=$?
          echo 'test_exit_code='"$code" >> /tmp/probe.md
          echo '```text' >> /tmp/probe.md
          grep -n -B 2 -A 60 "^not ok" /tmp/test.log | head -n 500 >> /tmp/probe.md
          tail -n 20 /tmp/test.log >> /tmp/probe.md
          echo '```' >> /tmp/probe.md
          exit 0

      - name: Sonde 4 - build
        run: |
          set +e
          echo "" >> /tmp/probe.md
          echo "### Sonde phase4 v1 — build" >> /tmp/probe.md
          echo "" >> /tmp/probe.md
          npm run build > /tmp/build.log 2>&1
          code=$?
          echo 'build_exit_code='"$code" >> /tmp/probe.md
          echo '```text' >> /tmp/probe.md
          tail -n 100 /tmp/build.log >> /tmp/probe.md
          echo '```' >> /tmp/probe.md
          exit 0

      - name: Sonde 5 - qa mobile built
        run: |
          set +e
          echo "" >> /tmp/probe.md
          echo "### Sonde phase4 v1 — qa:mobile:built" >> /tmp/probe.md
          echo "" >> /tmp/probe.md
          npm run qa:mobile:built > /tmp/qa.log 2>&1
          code=$?
          echo 'qa_exit_code='"$code" >> /tmp/probe.md
          echo '```text' >> /tmp/probe.md
          tail -n 120 /tmp/qa.log >> /tmp/probe.md
          echo '```' >> /tmp/probe.md
          exit 0

      - name: Sonde 6 - E2E Playwright
        run: |
          set +e
          set -o pipefail
          echo "" >> /tmp/probe.md
          echo "### Sonde phase4 v1 — E2E Playwright" >> /tmp/probe.md
          echo "" >> /tmp/probe.md
          echo '```text' >> /tmp/probe.md
          npx playwright install --with-deps chromium > /dev/null 2>&1
          CI=true npx playwright test 2>&1 | tail -n 120 >> /tmp/probe.md
          code=$?
          echo "e2e_exit_code=$code" >> /tmp/probe.md
          echo '```' >> /tmp/probe.md
          exit 0

      - name: Post probe results as PR comment
        if: always()
        run: |
          cat /tmp/probe.md
          gh pr comment 46 --repo TOKYO203/grok-medical-app --body-file /tmp/probe.md
