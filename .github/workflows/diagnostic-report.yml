name: R7 diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run routes:generate
      - name: Tests
        run: |
          set +e
          npm test > /tmp/tests.log 2>&1
          code=$?
          {
            echo "## Tests (exit $code, $(wc -l < /tmp/tests.log) lignes)"
            echo ""
            echo "### Tests en échec"
            echo ""
            echo "```"
          } > /tmp/report.md
          grep -E -A 30 '^not ok' /tmp/tests.log | head -n 600 >> /tmp/report.md
          {
            echo "```"
            echo ""
            echo "### Queue du log"
            echo ""
            echo "```"
            tail -n 60 /tmp/tests.log
            echo "```"
          } >> /tmp/report.md
          exit 0
      - name: Publie l'issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          short=$(git rev-parse --short HEAD)
          gh issue create --title "R7 diagnostic $short" --body-file /tmp/report.md || true
