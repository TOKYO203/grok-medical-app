name: Diagnostic report

# TEMPORAIRE (R7) : publie le résultat de Tests/Typecheck/Lint dans une issue,
# car les annotations des runs ne sont pas lisibles hors API authentifiée.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Rapport vers issue
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Collecte des rapports
        run: |
          {
            echo "# Rapport R7 — commit ${GITHUB_SHA}"
            echo '## Tests'
            echo '```'
            npm test 2>&1 | tail -n 120
            echo '```'
            echo '## Typecheck'
            echo '```'
            npm run typecheck 2>&1 | tail -n 120
            echo '```'
            echo '## Lint'
            echo '```'
            npm run lint 2>&1 | tail -n 120
            echo '```'
          } > /tmp/report.md
          exit 0

      - name: Publication dans une issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "R7 diagnostic ${GITHUB_SHA}" \
            --body-file /tmp/report.md
