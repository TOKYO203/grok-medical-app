name: R7 diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Typecheck puis lint
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          tc=$?
          npx eslint . > /tmp/lint.log 2>&1
          lint=$?
          fence=$(printf '\\140\\140\\140')
          {
            printf '## Typecheck (exit %s) / Lint (exit %s)\n\n' "$tc" "$lint"
            printf '%s\n' "$fence"
          } > /tmp/report.md
          grep -E -A 8 'error TS' /tmp/typecheck.log | head -n 200 >> /tmp/report.md
          {
            printf '%s\n' "$fence"
            printf '\n### Lint\n\n'
            printf '%s\n' "$fence"
          } >> /tmp/report.md
          grep -E -B 1 -A 6 'error' /tmp/lint.log | head -n 200 >> /tmp/report.md
          {
            printf '%s\n' "$fence"
            printf '\n### Fin typecheck\n\n'
            printf '%s\n' "$fence"
            tail -n 30 /tmp/typecheck.log
            printf '%s\n' "$fence"
          } >> /tmp/report.md
          exit 0
      - name: Publie l'issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          short=$(git rev-parse --short HEAD)
          gh issue create --title "R7 diagnostic $short" --body-file /tmp/report.md || true
