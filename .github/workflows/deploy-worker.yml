name: Deploy Worker

# Déploiement automatique sur main : le contenu Premium vit désormais dans le
# graphe serveur (pentest 2026-11-09 §1/§14/§15) et porte le worker à ~29 MiB,
# au-dessus de la limite Pages (25 MiB). La prod est donc le Worker
# (limite 64 MiB, tous plans depuis sept. 2026) ; le projet Pages est à mettre
# en pause une fois le Worker validé.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Build Worker
        run: npm run build:worker
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Clean stale wrangler redirections
        run: rm -rf .wrangler

      - name: Override worker name
        run: |
          node -e "const fs=require('fs');const p='.output/server/wrangler.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.name='optimus';j.assets=j.assets||{};j.assets.not_found_handling='single-page-application';j.workers_dev=true;fs.writeFileSync(p,JSON.stringify(j,null,2));"
          node -e "console.log('name =', JSON.parse(require('fs').readFileSync('.output/server/wrangler.json','utf8')).name)"
      # Variables d'authentification injectées au déploiement (pas dans le
      # dashboard) : sur un Worker, CF_PAGES_URL n'existe pas, donc
      # BETTER_AUTH_URL doit être explicite. Les secrets absents sont simplement
      # omis (l'app retombe alors sur son mode « profil local » documenté).

      - name: Inject worker config (assets + compat flags)
        run: |
          node -e "
            const fs=require('fs');
            const p='.output/server/wrangler.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            j.compatibility_date='2025-04-01';
            j.compatibility_flags=Array.from(new Set([...(j.compatibility_flags||[]),'nodejs_compat','nodejs_compat_populate_process_env']));
            j.assets=j.assets||{};
            j.assets.run_worker_first=['/api/*'];
            fs.writeFileSync(p,JSON.stringify(j,null,2));
            console.log('compat_flags=',j.compatibility_flags);
            console.log('run_worker_first=',j.assets.run_worker_first);
          "

      - name: Deploy with Wrangler
        run: |
          ARGS="--config .output/server/wrangler.json"
          ARGS="$ARGS --var BETTER_AUTH_URL:https://optimus.carabin.workers.dev"
          ARGS="$ARGS --var TRUST_PROXY_HEADERS:true"
          if [ -n "$GROK_AUTH_CLIENT_ID" ]; then
            ARGS="$ARGS --var GROK_AUTH_CLIENT_ID:$GROK_AUTH_CLIENT_ID"
          fi
          if [ -n "$GROK_AUTH_CLIENT_SECRET" ]; then
            ARGS="$ARGS --var GROK_AUTH_CLIENT_SECRET:$GROK_AUTH_CLIENT_SECRET"
          fi
          if [ -n "$BETTER_AUTH_SECRET" ]; then
            ARGS="$ARGS --var BETTER_AUTH_SECRET:$BETTER_AUTH_SECRET"
          fi
          npx wrangler deploy $ARGS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROK_AUTH_CLIENT_ID: ${{ secrets.GROK_AUTH_CLIENT_ID }}
          GROK_AUTH_CLIENT_SECRET: ${{ secrets.GROK_AUTH_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
