name: Deploy Worker

# Déclenchement manuel uniquement : la prod vit sur Cloudflare Pages
# (déploiement confirmé le 2026-11-07, worker 23,63 MiB < 25 MiB).
# La voie Workers reste disponible pour un futur besoin (64 MiB).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Build Worker
        run: npm run build:worker
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Clean stale wrangler redirections
        run: rm -rf .wrangler
      - name: Override worker name
        run: |
          node -e "const fs=require(fs);const p=.output/server/wrangler.json;const j=JSON.parse(fs.readFileSync(p,utf8));j.name=optimus-medical-prod;fs.writeFileSync(p,JSON.stringify(j,null,2));"
          grep -E 
ame .output/server/wrangler.json | head -1
      - name: Deploy with Wrangler
        run: npx wrangler deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
