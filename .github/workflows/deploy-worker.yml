name: Deploy Cloudflare Worker

# Production : Workers + Static Assets via wrangler 4 (limite 64 MiB, bundle
# unique — cf. wrangler.jsonc et docs/DEPLOIEMENT-CLOUDFLARE.md). Nécessite les
# secrets CLOUDFLARE_API_TOKEN ( Workers Scripts:Edit) et
# CLOUDFLARE_ACCOUNT_ID. Sans eux ce workflow échoue rouge et visible.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-worker.yml'
      - 'wrangler.jsonc'
      - 'vite.config.ts'
      - 'src/**'
      - 'scripts/**'
      - 'server/**'
      - 'public/**'
      - 'private/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build (preset cloudflare_module, stubs actifs via CF_PAGES)
        run: npm run build:worker
      - name: Nettoyer la config wrangler générée par Nitro (conflit)
        run: rm -rf .wrangler
      - name: Vérifier les sorties
        run: |
          echo "— .output/server —" && ls -la .output/server/ | head -5
          echo "— dist —" && ls dist/ | head -10
          test -f .output/server/index.mjs
          test -d dist
      - name: Deploy (wrangler 4 du repo)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
