name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Post-mortem 2026-11-07, soldé le 2026-11-08 (R7) : la suite
# typecheck/lint cassée depuis le 24 octobre a été réparée (dette R7 fermée,
# CI verte). Conformément à la note du post-mortem, typecheck et lint sont
# de retour BLOQUANTS ici aussi ; le job reste centré sur la suite Playwright
# (4 specs tests/e2e). Le script npm typecheck régénère l'arbre des routes
# avant tsc, comme dans ci.yml.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
