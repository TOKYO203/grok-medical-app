name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npmci.log

      - name: TypeScript check
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee /tmp/tsc.log

      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/lint.log

      - name: Install Playwright browsers
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee /tmp/pwinstall.log

      - name: Run E2E tests
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee /tmp/pwtest.log
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Publish diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Diagnostic test E2E (run ${{ github.run_id }})"
            for f in npmci tsc lint pwinstall pwtest; do
              if [ -f /tmp/$f.log ]; then
                echo ""
                echo "#### $f"
                echo '```'
                tail -c 6000 /tmp/$f.log
                echo '```'
              fi
            done
          } > /tmp/diag.md
          gh api repos/TOKYO203/grok-medical-app/issues/50/comments -F body=@/tmp/diag.md || true
