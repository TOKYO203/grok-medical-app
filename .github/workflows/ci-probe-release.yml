name: CI Probe release-check v2 (TEMPORAIRE — a retirer avant fusion)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Probe q4 npm run build (chaine complete)
        run: |
          if npm run build >/tmp/q4.log 2>&1; then
            echo "q4 npm run build: PASS" >> /tmp/summary.md
          else
            { echo "q4 npm run build: FAIL"; echo '```'; tail -n 150 /tmp/q4.log; echo '```'; } >> /tmp/summary.md
          fi

      - name: Probe q5 qa:mobile:built (rapport complet)
        run: |
          if npm run qa:mobile:built >/tmp/q5.log 2>&1; then
            echo "q5 qa:mobile:built: PASS" >> /tmp/summary.md
          else
            { echo "q5 qa:mobile:built: FAIL — rapport complet ci-dessous"; echo '```'; tail -n 500 /tmp/q5.log; echo '```'; } >> /tmp/summary.md
          fi

      - name: Probe q6 logs du run CodeQL precede (echoue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow security.yml --branch fix/ci-green --status completed --limit 1 --json databaseId --jq '.[0].databaseId')
          { echo "q6 CodeQL (run $RUN_ID) — etapes echouees:"; echo '```'; gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -n 150; echo '```'; } >> /tmp/summary.md

      - name: Probe q7 logs du run release-check precede (echoue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch fix/ci-green --status completed --limit 1 --json databaseId --jq '.[0].databaseId')
          { echo "q7 release-check (run $RUN_ID) — etapes echouees:"; echo '```'; gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -n 100; echo '```'; } >> /tmp/summary.md

      - name: Post summary to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Sonde v2 — commit ${GITHUB_SHA}"
            cat /tmp/summary.md 2>/dev/null || echo "(aucun resultat)"
          } > /tmp/body.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
