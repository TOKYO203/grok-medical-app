name: CI probe session1
on:
  push:
    branches: [feat/business-model-session1]
  workflow_dispatch: {}
permissions:
  actions: read
  pull-requests: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Attendre les runs CI du commit pousse puis journaliser les jobs en echec
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="$GITHUB_REPOSITORY"
          BRANCH="feat/business-model-session1"
          SHA="$GITHUB_SHA"
          sleep 40
          for i in $(seq 1 120); do
            PENDING=$(gh run list --repo "$REPO" --workflow CI --branch "$BRANCH" --limit 8 --json status,headSha --jq "[.[] | select(.headSha==\"$SHA\") | select(.status==\"queued\" or .status==\"in_progress\")] | length")
            if [ "$PENDING" = "0" ]; then break; fi
            sleep 10
          done
          {
            echo "## Sonde CI v2 — commit ${SHA:0:9}"
            RUNS=$(gh run list --repo "$REPO" --workflow CI --branch "$BRANCH" --limit 8 --json databaseId,headSha,conclusion,event --jq "[.[] | select(.headSha==\"$SHA\")]")
            for RUN_ID in $(echo "$RUNS" | jq -r '.[].databaseId'); do
              EVENT=$(echo "$RUNS" | jq -r --argjson id "$RUN_ID" '.[] | select(.databaseId==$id) | .event')
              CONCLUSION=$(echo "$RUNS" | jq -r --argjson id "$RUN_ID" '.[] | select(.databaseId==$id) | .conclusion')
              echo ""
              echo "### Run $RUN_ID (event $EVENT, conclusion $CONCLUSION)"
              FAILED_JOBS=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs --jq '[.jobs[] | select(.conclusion=="failure" and .name!="CodeQL")]')
              if [ "$(echo "$FAILED_JOBS" | jq 'length')" = "0" ]; then echo "Aucun job en echec (hors CodeQL)."; continue; fi
              for JOB_ID in $(echo "$FAILED_JOBS" | jq -r '.[].databaseId'); do
                JOB_NAME=$(echo "$FAILED_JOBS" | jq -r --argjson j "$JOB_ID" '.[] | select(.databaseId==$j) | .name')
                echo ""
                echo "#### Job $JOB_NAME"
                echo '```'
                gh run view --log --repo "$REPO" --job "$JOB_ID" 2>/dev/null | grep -v "Post Checkout\|Post job\|Complete job\|Cleaning up\|safe.directory\|git config\|git submodule\|includeIf\|git-credentials\|Removing SSH\|Removing HTTP\|git version\|Temporarily overriding\|Node.js 20 is deprecated" | tail -n 300 || true
                echo '```'
              done
            done
            echo ""
            echo "_(Sonde temporaire v2 — retiree apres diagnostic.)_"
          } > logs.txt
          gh pr comment 48 --repo "$REPO" --body-file logs.txt || true
