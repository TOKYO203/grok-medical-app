name: CI

on:
  push:
    branches: [ main, fix/quality-gates, release/v1-hardening ]
  pull_request:
    branches: [ main, fix/quality-gates, release/v1-hardening ]

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Run release readiness checks
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          run_step() {
            name="$1"; shift
            if "$@" > /tmp/step.log 2>&1; then
              echo "[diag] $name OK"
            else
              echo "::error title=$name::release:check a échoué à l'étape [$name] — extrait du test en échec :"
              grep -B 3 -A 18 '^not ok' /tmp/step.log | head -n 9 | while IFS= read -r l; do
                printf '::error title=%s::%s\n' "$name" "$(printf '%s' "$l" | sed 's/%/%%25/g; s/\r$//')"
              done
              if [ -n "${PR_NUMBER:-}" ]; then
                {
                  echo "### Diagnostic release:check — échec à l'étape [$name] (instrumentation temporaire)"
                  echo '~~~'
                  grep -B 10 -A 60 '^not ok' /tmp/step.log | head -n 150
                  echo '~~~'
                  echo '~~~'
                  tail -n 40 /tmp/step.log
                  echo '~~~'
                } > /tmp/comment.md
                gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md || true
              fi
              exit 1
            fi
          }
          run_step routes-generate npm run routes:generate
          run_step test npm test
          run_step typecheck npm run typecheck
          run_step lint npm run lint
          run_step build npm run build

      - name: Audit primary screens at 320 / 360 / 390 px
        run: npm run qa:mobile:built

  database-recovery-smoke:
    name: PostgreSQL backup / restore smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: optimus
          POSTGRES_PASSWORD: optimus
          POSTGRES_DB: optimus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U optimus -d optimus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://optimus:optimus@localhost:5432/optimus
      PGPASSWORD: optimus
      VITE_AUTH_ENABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Prove empty and legacy identity migrations on disposable PostgreSQL databases
        env:
          TEST_POSTGRES_URL: postgresql://optimus:optimus@localhost:5432/optimus
        run: node --test scripts/staging-migration.test.mjs

      - name: Apply migrations and seed recovery probe
        run: |
          npm run db:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create table if not exists disaster_recovery_probe (
            id integer primary key,
            marker text not null
          );
          insert into disaster_recovery_probe (id, marker)
          values (1, 'optimus-recovery-ok')
          on conflict (id) do update set marker = excluded.marker;
          SQL

      - name: Backup database
        run: pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL" > /tmp/optimus.dump

      - name: Destroy and recreate disposable database
        run: |
          psql "postgresql://optimus:optimus@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "select pg_terminate_backend(pid) from pg_stat_activity where datname = 'optimus' and pid <> pg_backend_pid();"
          dropdb --host=localhost --username=optimus optimus
          createdb --host=localhost --username=optimus optimus

      - name: Restore backup
        run: pg_restore --host=localhost --username=optimus --dbname=optimus --no-owner --no-acl --exit-on-error /tmp/optimus.dump

      - name: Verify recovery
        run: |
          test "$(psql "$DATABASE_URL" -Atc "select marker from disaster_recovery_probe where id = 1")" = "optimus-recovery-ok"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) > 0 from _migrations")" = "t"
          echo "Database backup/restore smoke: OK"
