name: CI

on:
  push:
    branches: [ main, fix/quality-gates, release/v1-hardening ]
  pull_request:
    branches: [ main, fix/quality-gates ]

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Run release readiness checks
        run: npm run release:check

      - name: Audit primary screens at 320 / 360 / 390 px
        run: npm run qa:mobile:built
