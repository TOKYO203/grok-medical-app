name: CI

on:
  push:
    branches: [ main, fix/quality-gates, release/v1-hardening ]
  pull_request:
    branches: [ main, fix/quality-gates, release/v1-hardening ]

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Run release readiness checks
        run: npm run release:check

      # INSTRUMENTATION TEMPORAIRE (diagnostic PR #106) : si release:check
      # échoue, rejouer chaque sous-étape et verser sa fin de sortie dans le
      # résumé du job — les logs bruts sont illisibles sans session GitHub.
      # À supprimer dès le diagnostic terminé.
      - name: Diagnose release-check failure (temporary)
        if: failure()
        run: |
          summary=""
          diag() {
            name="$1"; shift
            echo "### $name" >> "$GITHUB_STEP_SUMMARY"
            if "$@" >/tmp/diag.txt 2>&1; then
              echo "OK" >> "$GITHUB_STEP_SUMMARY"
              summary="$summary $name=OK;"
            else
              echo "ÉCHEC — 60 dernières lignes :" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -n 60 /tmp/diag.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              summary="$summary $name=FAIL;"
              msg="$(grep -aE 'not ok|✖|✗|# fail [1-9]|failing tests|exceeds|Error:|error TS|ELIFECYCLE|command failed' /tmp/diag.txt | head -n 14 || true)"
              if [ -z "$msg" ]; then msg="$(tail -n 14 /tmp/diag.txt || true)"; fi
              msg="$(printf '%s' "$msg" | awk 'BEGIN{ORS=""} {gsub(/%/,"%25"); gsub(/:/,"%3A"); print $0 "%0A"}' | cut -c1-1600 || true)"
              echo "::error title=diag $name::$msg"
            fi
          }
          diag routes:generate npm run routes:generate
          diag npm-test-scripts node --test 'scripts/**/*.test.mjs'
          diag npm-test-src node --experimental-strip-types --test src/content/imported-deck-integrity.test.ts src/content/license-receipt.test.ts src/content/purchase-order.test.ts src/lib/auth/gate-identity.test.ts src/lib/auscultation/phonocardiogram.test.ts src/lib/auscultation/catalog.test.ts src/lib/ecg/deformation.test.ts src/lib/ecg/analyzeEcg.test.ts src/lib/ecg/waveform.test.ts src/lib/ecg/ecg-fiches.test.ts src/lib/cloud/subscription.test.ts src/lib/imported-deck-storage.test.ts src/lib/library/specialty-label.test.ts src/lib/library/deck-series.test.ts src/lib/optimus-sync-model.test.ts src/state/persist-migrations.test.ts src/i18n/messages.test.ts src/i18n/detect.test.ts src/i18n/format.test.ts src/lib/units.test.ts src/server/jwt.test.ts src/server/replay-guard.test.ts src/server/license-verify.test.ts src/content/international.test.ts src/server/lemonsqueezy/signature.test.ts src/server/lemonsqueezy/webhook.test.ts src/server/lemonsqueezy/checkout.server.test.ts
          diag typecheck npm run typecheck
          diag lint npm run lint
          diag build npm run build
          echo "::notice title=diag summary::$summary"

      - name: Audit primary screens at 320 / 360 / 390 px
        run: npm run qa:mobile:built

  database-recovery-smoke:
    name: PostgreSQL backup / restore smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: optimus
          POSTGRES_PASSWORD: optimus
          POSTGRES_DB: optimus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U optimus -d optimus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://optimus:optimus@localhost:5432/optimus
      PGPASSWORD: optimus
      VITE_AUTH_ENABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Prove empty and legacy identity migrations on disposable PostgreSQL databases
        env:
          TEST_POSTGRES_URL: postgresql://optimus:optimus@localhost:5432/optimus
        run: node --test scripts/staging-migration.test.mjs

      - name: Apply migrations and seed recovery probe
        run: |
          npm run db:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create table if not exists disaster_recovery_probe (
            id integer primary key,
            marker text not null
          );
          insert into disaster_recovery_probe (id, marker)
          values (1, 'optimus-recovery-ok')
          on conflict (id) do update set marker = excluded.marker;
          SQL

      - name: Backup database
        run: pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL" > /tmp/optimus.dump

      - name: Destroy and recreate disposable database
        run: |
          psql "postgresql://optimus:optimus@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "select pg_terminate_backend(pid) from pg_stat_activity where datname = 'optimus' and pid <> pg_backend_pid();"
          dropdb --host=localhost --username=optimus optimus
          createdb --host=localhost --username=optimus optimus

      - name: Restore backup
        run: pg_restore --host=localhost --username=optimus --dbname=optimus --no-owner --no-acl --exit-on-error /tmp/optimus.dump

      - name: Verify recovery
        run: |
          test "$(psql "$DATABASE_URL" -Atc "select marker from disaster_recovery_probe where id = 1")" = "optimus-recovery-ok"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) > 0 from _migrations")" = "t"
          echo "Database backup/restore smoke: OK"
