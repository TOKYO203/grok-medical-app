name: CI probe phase5

on:
  push:
    branches: [fix/qualite-phase5]

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Sonde 1 - routes generate
        run: |
          set +e
          echo "### Sonde phase5 v1 — routes:generate" > /tmp/probe.md
          echo "" >> /tmp/probe.md
          npm run routes:generate > /tmp/rg.log 2>&1
          code=$?
          echo 'routes_generate_exit_code='"$code" >> /tmp/probe.md
          echo '```text' >> /tmp/probe.md
          tail -n 40 /tmp/rg.log >> /tmp/probe.md
          echo '```' >> /tmp/probe.md
          exit 0

      - name: Sonde 2 - tests
        run: |
          set +e
          echo "" >> /tmp/probe.md
          echo "### Sonde phase5 v1 — npm test" >> /tmp/probe.md
          echo "" >> /tmp/probe.md
          npm test > /tmp/test.log 2>&1
          code=$?
          echo 'test_exit_code='"$code" >> /tmp/probe.md
          echo '```text' >> /tmp/probe.md
          grep -n -B 2 -A 30 "^not ok" /tmp/test.log | head -n 300 >> /tmp/probe.md
          tail -n 25 /tmp/test.log >> /tmp/probe.md
          echo '```' >> /tmp/probe.md
          exit 0

      - name: Sonde 3 - typecheck + lint
        run: |
          set +e
          echo "" >> /tmp/probe.md
          echo "### Sonde phase5 v1 — typecheck + lint" >> /tmp/probe.md
          echo "" >> /tmp/probe.md
          npm run typecheck > /tmp/tsc.log 2>&1
          echo 'typecheck_exit_code='"$?" >> /tmp/probe.md
          npm run lint > /tmp/lint.log 2>&1
          echo 'lint_exit_code='"$?" >> /tmp/probe.md
          echo '```text' >> /tmp/probe.md
          tail -n 60 /tmp/tsc.log >> /tmp/probe.md
          tail -n 60 /tmp/lint.log >> /tmp/probe.md
          echo '```' >> /tmp/probe.md
          exit 0

      - name: Sonde 4 - build
        run: |
          set +e
          echo "" >> /tmp/probe.md
          echo "### Sonde phase5 v1 — build" >> /tmp/probe.md
          echo "" >> /tmp/probe.md
          npm run build > /tmp/build.log 2>&1
          code=$?
          echo 'build_exit_code='"$code" >> /tmp/probe.md
          echo '```text' >> /tmp/probe.md
          tail -n 60 /tmp/build.log >> /tmp/probe.md
          echo '```' >> /tmp/probe.md
          exit 0

      - name: Post probe results as PR comment
        if: always()
        run: |
          cat /tmp/probe.md
          gh pr comment 47 --repo TOKYO203/grok-medical-app --body-file /tmp/probe.md
