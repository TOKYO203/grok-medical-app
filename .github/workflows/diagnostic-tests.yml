name: Diagnostic tests

# TEMPORAIRE — à supprimer une fois la suite RPC/webhook réparée (R7).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Echecs visibles en annotations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Tests scripts (.mjs)
        run: |
          for f in scripts/*.test.mjs; do
            node --test "$f" > /tmp/one.log 2>&1 || true
            if grep -qE '^not ok ' /tmp/one.log; then
              names=$(grep -E '^not ok ' /tmp/one.log | sed 's/^not ok [0-9]* - //' | head -n 4 | tr '\n' ';' | cut -c1-220)
              detail=$(grep -m1 -E '^ *error: ' /tmp/one.log | cut -c1-260)
              echo "::error::FICHIER $f :: TESTS $names :: DETAIL $detail"
            fi
          done

      - name: Tests src (.ts)
        run: |
          find src -name '*.test.ts' -print0 | xargs -0 node --experimental-strip-types --test > /tmp/src-tests.log 2>&1 || true
          grep -E '^not ok ' /tmp/src-tests.log | head -n 10 | sed 's/^not ok [0-9]* - /::error::src-test /'

      - name: Typecheck
        run: |
          npx tsc --noEmit > /tmp/typecheck.log 2>&1 || true
          grep -E 'error TS' /tmp/typecheck.log | head -n 10 | sed 's/^/::error::tsc /'

      - name: Lint
        run: |
          npx eslint . -f unix > /tmp/lint.log 2>&1 || true
          sed 's|/home/runner/work/grok-medical-app/grok-medical-app/||' /tmp/lint.log | grep -E ' error ' | head -n 20 | cut -c1-250 | sed 's/^/::error::ESLint /'
