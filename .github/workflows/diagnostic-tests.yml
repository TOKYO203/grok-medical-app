name: Diagnostic tests

# TEMPORAIRE — à supprimer une fois la suite réparée (R7).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Echecs visibles en annotations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Tests scripts (.mjs)
        run: |
          for f in scripts/*.test.mjs; do
            node --test "$f" > /tmp/one.log 2>&1 || true
            if grep -qE '^not ok ' /tmp/one.log; then
              names=$(grep -E '^not ok ' /tmp/one.log | sed 's/^not ok [0-9]* - //' | head -n 4 | tr '\n' ';' | cut -c1-220)
              echo "::error::FICHIER $f :: TESTS $names"
              # Blocs d'erreur YAML : erreur + expected + actual (multi-lignes)
              awk '/^ *error:/{c=8} c&&c--' /tmp/one.log | head -n 14 | sed 's/^ */ /' > /tmp/errblock
              paste -sd '|' /tmp/errblock | cut -c1-1400 | sed 's/^/::error::DETAIL /'
            fi
          done

      - name: Lint
        run: |
          npx eslint . -f unix > /tmp/lint.log 2>&1 || true
          sed 's|/home/runner/work/grok-medical-app/grok-medical-app/||' /tmp/lint.log | grep -E ' error ' | head -n 20 | cut -c1-250 | sed 's/^/::error::ESLint /'
