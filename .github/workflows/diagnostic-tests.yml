name: Diagnostic tests

# TEMPORAIRE — à supprimer une fois la suite réparée (R7).
# v5 : annotation courte (1/fichier) + log complet de chaque fichier en échec
# dans le résumé du job (pas de cap de taille).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Echecs visibles en annotations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Tests scripts (.mjs)
        run: |
          {
            echo "# Diagnostic tests — logs complets des échecs"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in scripts/*.test.mjs; do
            node --test "$f" > /tmp/one.log 2>&1 || true
            if grep -qE '^not ok ' /tmp/one.log; then
              names=$(grep -E '^not ok ' /tmp/one.log | sed 's/^not ok [0-9]* - //' | head -n 4 | tr '\n' ';' | cut -c1-200)
              echo "::error::FICHIER $f :: TESTS $names"
              {
                echo "## $f"
                echo '~~~'
                sed -n '1,200p' /tmp/one.log
                echo '~~~'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Lint
        run: |
          npx eslint . -f unix > /tmp/lint.log 2>&1 || true
          sed 's|/home/runner/work/grok-medical-app/grok-medical-app/||' /tmp/lint.log | grep -E ' error ' | head -n 5 | cut -c1-250 | sed 's/^/::error::ESLint /'
