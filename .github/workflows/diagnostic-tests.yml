name: Diagnostic tests

# TEMPORAIRE — à supprimer une fois la suite réparée (R7).
# v4 : UNE annotation par fichier en échec (fichier + tests + 1re ligne
# d'erreur fusionnés), pour tenir dans le cap de 10 annotations.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Echecs visibles en annotations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Tests scripts (.mjs)
        run: |
          for f in scripts/*.test.mjs; do
            node --test "$f" > /tmp/one.log 2>&1 || true
            if grep -qE '^not ok ' /tmp/one.log; then
              names=$(grep -E '^not ok ' /tmp/one.log | sed 's/^not ok [0-9]* - //' | head -n 4 | tr '\n' ';' | cut -c1-200)
              err=$(grep -E '^\s+error:' /tmp/one.log | head -n 1 | sed 's/^\s*//' | cut -c1-320)
              if [ -z "$err" ]; then
                err=$(grep -B1 -E '^\s+(expected|actual):' /tmp/one.log | grep -vE '^\s*$' | head -n 1 | sed 's/^\s*//' | cut -c1-320)
              fi
              echo "::error::FICHIER $f :: TESTS $names :: ERR $err"
            fi
          done

      - name: Lint
        run: |
          npx eslint . -f unix > /tmp/lint.log 2>&1 || true
          sed 's|/home/runner/work/grok-medical-app/grok-medical-app/||' /tmp/lint.log | grep -E ' error ' | head -n 5 | cut -c1-250 | sed 's/^/::error::ESLint /'
