name: Lockfile polices auto-hébergées

on:
  push:
    branches: [fix/fonts-selfhosted-phase2]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ajouter @fontsource (package.json + package-lock.json)
        run: npm install --legacy-peer-deps --save @fontsource/figtree @fontsource/fraunces @fontsource/ibm-plex-mono

      - name: Commit du lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): polices auto-hébergées @fontsource (package.json + lockfile)" || echo "rien à committer"
          git push
